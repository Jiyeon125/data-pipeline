[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "open-fiscal-data-pipeline"
version = "0.2.0"
description = "Open Fiscal Data API collection and classification master pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "matplotlib>=3.8,<4",
    "openpyxl>=3.1,<4",
    "pandas>=2.2,<3",
    "pyarrow>=15,<22",
    "pymupdf>=1.24,<2",
    "pytesseract>=0.3,<1",
    "python-dotenv>=1.0,<2",
    "PyYAML>=6.0,<7",
    "typer>=0.12,<1",
  ]

[project.optional-dependencies]
dev = [
  "ipykernel>=6.29,<7",
  "nbclient>=0.10,<1",
  "nbformat>=5.10,<6",
  "pytest>=8,<9",
  "ruff>=0.5,<1",
]

[project.scripts]
openfiscal = "open_fiscal_pipeline.cli:app"
fiscal-master = "master_engineering.cli:app"
fiscal-analytics = "analytics.cli:app"
fiscal-performance = "performance_pipeline.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest_tmp"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"src/open_fiscal_pipeline/cli.py" = ["B008"]
"src/master_engineering/cli.py" = ["B008"]
"src/analytics/cli.py" = ["B008"]
"src/performance_pipeline/cli.py" = ["B008"]
