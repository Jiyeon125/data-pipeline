interpretation:
  status: exploratory
  evidence_boundary: >
    설정에 포함된 부처의 수기 성과표와 원문 검수 상태를 분리합니다.
    순위는 점검 순서를 좁히는 탐색 결과이며 자동 정책 판정으로 사용하지 않습니다.
  fiscal_impact_role: >
    전체 순위는 연도 내 설정 부처 전체의 예산 백분위, 부처별 순위는
    부처-연도 내 예산 백분위를 사용합니다.
