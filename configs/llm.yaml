llm:
  provider: openai
  default_model: gpt-5.6-luna
  model_env: OPENAI_MODEL
  api_key_env: OPENAI_API_KEY
  reasoning_effort: low
  temperature: 0
  max_retries: 2
  request_timeout_seconds: 120
  prompt_version: performance_extraction_v1
  schema_version: performance_indicator_v1
  api_execution_allowed: false

extraction:
  batch_pages: 1
  preserve_source_text: true
  require_source_page: true
  null_when_unverified: true

review:
  auto_verify: false
  confidence_threshold_for_review: 0.8
  statuses:
    - UNREVIEWED
    - VERIFIED
    - CORRECTED
    - REJECTED
    - AMBIGUOUS

harness:
  max_evidence_chars: 1200
  max_output_tokens: 1800
  estimated_output_tokens_per_request: 450
  pilot_request_limit: 12
  max_build_qa_cost_usd: 80
  batch_discount: 0.5
  pricing_checked_on: "2026-07-31"
  pricing_source: "https://developers.openai.com/api/docs/pricing"
  pricing_usd_per_million:
    gpt-5.6-luna:
      input: 0.20
      cached_input: 0.02
      output: 1.20
    gpt-5.6-terra:
      input: 2.00
      cached_input: 0.20
      output: 12.00
    gpt-5.6-sol:
      input: 5.00
      cached_input: 0.50
      output: 30.00
